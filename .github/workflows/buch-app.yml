name: Buch-App bauen

on:
  push:
    branches: [anfaenger-buch]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Flet installieren
        run: pip install "flet[all]==1.0.5"
      - name: APK bauen
        working-directory: buch-app
        env:
          PYTHONIOENCODING: utf-8
        run: flet build apk --arch arm64-v8a --yes --no-rich-output
      - uses: actions/upload-artifact@v4
        with:
          name: Filmregal-Buch
          path: buch-app/build/apk/*.apk
