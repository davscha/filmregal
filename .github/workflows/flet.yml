name: Python-Prototyp bauen

on:
  push:
    branches: [main]
    paths: ["flet-prototyp/**", ".github/workflows/flet.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Flet installieren
        run: pip install "flet[all]==1.0.5"

      - name: APK bauen
        working-directory: flet-prototyp
        env:
          PYTHONIOENCODING: utf-8
        run: flet build apk --arch arm64-v8a --yes --no-rich-output

      - name: APK umbenennen
        run: |
          ls -la flet-prototyp/build/apk
          cp "$(ls flet-prototyp/build/apk/*.apk | head -1)" Filmregal-Python.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Filmregal-Python
          path: Filmregal-Python.apk

      - name: Release aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete flet-latest --yes --cleanup-tag || true
          gh release create flet-latest Filmregal-Python.apk \
            --title "Filmregal Python-Prototyp – Build ${{ github.run_number }}" \
            --notes "Flet-Prototyp, automatisch gebaut aus ${{ github.sha }}" \
            --target ${{ github.sha }} --prerelease
